[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "musicskills"
version = "1.0.0"
description = "Professional AI Music Song Creation & Humanization Toolkit for Claude, Gemini, and ChatGPT."
readme = "README.md"
authors = [{ name = "Aarav Kharade" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mido>=1.3.0",
]

[project.scripts]
music-song-gen = "scripts.cli:main"

[tool.setuptools.packages.find]
include = ["scripts*", "examples*"]

